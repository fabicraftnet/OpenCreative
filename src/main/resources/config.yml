hide-from-tab: spectator # Hides players, that aren't in same world: spectator - Transparent nickname (requires ProtocolLib), full - Full hide from tab list, none - Not hide.

#
# Lobby is a world, where player teleports on server join,
# on commands usage: /spawn, /lobby, /hub, and when player
# is banned or kicked from someone's world.
#
# To change spawn location of world, use:
# /oc setspawn
#
lobby:
  # Name of existing world for lobby to teleport player.
  world: "world"

  # Disallows placing blocks in lobby, if player doesn't have permission: opencreative.lobby.placing-blocks.bypass
  #
  # true - yes, disallow it.
  # false - no, allow it.
  disallow-placing-blocks: true

  # Disallows destroying blocks in lobby, if player doesn't have permission: opencreative.lobby.destroying-blocks.bypass
  disallow-destroying-blocks: true

  # Disallows spawning mobs in lobby, if player doesn't have permission: opencreative.lobby.spawning-mobs.bypass
  disallow-spawning-mobs: true

  # Disallows damaging mobs in lobby, if player doesn't have permission: opencreative.lobby.damaging-mobs.bypass
  disallow-damaging-mobs: true

  # Disallows using WorldEdit in lobby, if player doesn't have permission: opencreative.lobby.world-edit.bypass
  disallow-world-edit: true

  # Disables any explosion (from creeper or TNT) in lobby.
  disable-explosions: true

  # Disables changing doors, fences, flower pots, item frames and trapdoors, if player doesn't have permission: opencreative.lobby.changing-blocks.bypass
  disallow-changing-blocks: true

  # Disables changing armor stands in lobby, if player doesn't have permission: opencreative.lobby.editing-armor-stands.bypass
  disallow-editing-armor-stands: true

  # Clears inventory when player moves between worlds.
  #
  # Recommended value: "all", it clears player's inventory, when they
  # change any world, to prevent from getting valuable items (diamonds),
  # or bad items (TNT) in other worlds.
  #
  # all - all worlds
  # creative - only planets and lobby world
  # planets - only planets
  # lobby - only lobby
  # none - disable clearing inventory (not safe!)
  clear-inventory: "all"

  # Resets player's game mode to adventure when they move between worlds.
  #
  # Recommended value: "all", it sets player's game mode to adventure, when they
  # change any world, to prevent from flying and getting bad items.
  #
  # all - all worlds
  # creative - only planets and lobby world
  # planets - only planets
  # lobby - only lobby
  # none - disable resetting game mode (not safe!)
  reset-gamemode: "all"

  # Cancels teleport events from other plugins, when location is out of world's borders.
  #
  # all - all worlds
  # creative - only planets and lobby world
  # planets - only planets
  # lobby - only lobby
  # none - do not cancel teleport
  cancel-out-of-borders-teleport: "planets"

  # Resets player's view and simulation distance when they move between worlds.
  #
  # If chunks in worlds are not visible, set to: false
  # It will disable "Set View Distance" and "Set Simulation Distance" player actions.
  reset-view-distance: true

  # Resets player's resource pack when they move between worlds.
  #
  # If you have resource pack changer plugin (ItemsAdder, Oraxen, Nexo...)
  # and their resource pack breaks, set to: false
  # It will disable "Set Resource Pack" player action.
  reset-resource-pack: true

  # Teleports player to lobby, when they join the server.
  teleport-on-join: true

  #spawn: # You can set spawn location with /oc setspawn command.
  #  x: 1
  #  y: 60
  #  z: 3
  #  yaw: 20   # Horizontal camera rotation
  #  pitch: 25 # Vertical camera rotation

#
# Economy is used for:
# - giving money reward on /like to world's owner
# - giving money when player buys item to world's owner
# - taking money when player buys from buyer.
#
# Vault plugin is required!
# Get it on: https://www.spigotmc.org/resources/vault.34315/

# To check balance and give money to players, you can use EssentialsX:
# Get it on: https://essentialsx.net/downloads
#
economy:
  # Type of economy: vault, none.
  type: auto

#
# List of recommended worlds in /games menu.
# These worlds are featured by server owners.
#
# To add world to recommendations, use:
# /oc recommend ID
#
# To remove world from recommendations, use:
# /oc unrecommend ID
#
recommended-worlds:
  - 1
  - 2
  - 3
  - 4
  - 5

#
# We support customizing all plugin's messages.
# Check /locales/ folder to see all translation files.
#
# To fully reset localization files, use:
# /oc resetlocale
#
messages:
  # Supported: en, ru, ua
  #
  #   For english language - en
  #   Для русского языка - ru
  #   Для української мови - ua
  #
  locale: en

  # Branding is displayed in lobby title and lobby message.
  # Branding uses MiniMessage (https://webui.advntr.dev/)!
  branding: "<white>Open<gradient:#dbdbdb:#A3E2FF>Creative</gradient><color:#74D3FF>+"

  # Prefix, that will be used in many messages.
  prefix: "&6 Worlds &8| &f"

  # Information about plugin, that will be displayed on /oc command.
  version: "&f \n &fPowered by Open&7Creative&b+ &3%version%\n &f%codename% \n \n &fContributors: &7McChicken Team, onn512, pawsashatoy, LWJENNI, HACKERPRO17, liventmst, logiklop\n &fTranslators: &7initzero, Nagibator6000Lol, DrakesWeb, kogtyv, Senmpai333 \n \n &cMcChicken Studio 2017-2026\n &c"

  # Creative Chat is global chat, accessed by ! in the beginning of message, or with /cc.
  cc-prefix: "&6 Creative Chat &8| &7"

  # You can use PAPI placeholders and MiniMessage here
  cc-chat: "%cc-prefix%&7%player%&7: %message%"

  # And you can use PAPI placeholders and MiniMessage here
  world-chat: "&7 %player% &8» &f%message%"

  # To see messages from other worlds, use /oc spy enable.
  world-chat-spy: "&8 (%world%) &7%player% &8» &f%message%"

  # Sends notification to player, when they text in local chat in an empty world without other players.
  notify-no-players-around: true

  # Hides player's messages, when they search world by input; change world's
  # or module's name, description; enter nickname or id for transferring ownership.
  cancel-chat-on-confirmation: false

  # Handles player's chat messages.
  #
  # If you have own chat managers (ChatControl...), you can set to: false
  handle-world-chat: true

  # Sends "Oops! An error has occurred..." error messages in console.
  critical-errors: true

  # Sends "Warning! ..." warning messages in console.
  warnings: true

  # Sends "Not found message ..." messages in console.
  not-found: false

  # Sends "[GRIEF: ID] Suspicious changes by Player: ..." messages in console.
  grief-stats: true

  # Sends "[SIGN: ID] Sign edited by Player: ... (x, y, z)" messages in console.
  sign-edits: true

  #
  # List of message paths, that will be not changed
  # even after /oc resetlocale. Recommended, if you
  # have some styled cool unique messages.
  #
  # To mark message as for saving, use:
  # /oc ignoremessage path.of.message
  #
  # To unmark message, so it can be reset, use:
  # /oc unignore path.of.message
  #
  do-not-reset: # These messages will be not changed, even after /oc resetlocale.
    - "path.of-the-message"
    #- "creating-world.welcome"

#
# List of allowed links, that player can use
# for specific inputs. Used to avoid bad sites,
# that can steal player's IP.
#
allowed-links:
  #
  # For player action: "Set Resource Pack"
  #
  resource-pack:
    - "dropbox.com"
    - "drive.google.com"
    - "cdn.modrinth.com"

#
# Coding is a unique feature of Creative+, that allows
# players to create games. Sometimes it can be unpredictable!
#
# To access coding world, join the world and use:
# /dev
#
# To compile a code, use:
# /play
#
# To stop a code, use:
# /build
#
coding:

  # Enables coding mode.
  enabled: true

  # Returns previous coding blocks selection menu from older versions.
  old-selection-menu: false

  # Name of default coding platforms generator, that will be used for all worlds.
  #
  # Don't change it, if your server contains already existing worlds!
  # To test generator, use:
  # /world platformer [ID]
  #
  # horizontal - Generates plots.
  # vertical - Generates floors.
  # legacy - Generates floors with visible world border.
  platforms-generator: "horizontal"

  #
  # Spacing for platforms generators.
  #
  # Don't change it, if your server contains already existing worlds!
  #
  platforms-spacing:

    # Y-distance between platforms for vertical generator.
    vertical: 5

    # Y-distance between platforms for legacy generator.
    legacy: 10

    # X/Z-distance between platforms for horizontal generator.
    horizontal: 102

  #
  # Cuts a side strip in vertical platforms for easier flying between floors.
  #
  # Don't change it, if your server contains already existing worlds!
  #
  platforms-vertical-notch:

    # Enables notch.
    enabled: false

    # Width of cut strip from platform edge on X axis.
    width: 3

  # Cancels sending message to local chat, when player sets new value of text, number, vector,
  # variable, potion, color while holding item in hand.
  cancel-chat-on-value-set: false

  # Cancels any action (player, entity, variable, world, control...)
  # if target entity in action is not in world.

  # By default, it's false to make possible to execute
  # non-player and non-entity actions, that don't require entity.
  ignore-actions-if-entity-not-in-world: false

  # Saves copies of codeScript.yml in /plugins/OpenCreative/history/ folder.
  # Useful, only if you want to detect which script could cause server lags.
  save-scripts-history: false

  #
  # You can disable some coding blocks,
  # if they're useless or harming performance.
  # disabled-actions:
  #  - "world_set_block_type"
  #
  disabled-events: []
  disabled-actions: []
  disabled-conditions: []

  #
  # Prompt handler is responsible for generating
  # code from players wishes by using command:
  # /env make [prompt]
  #
  # Notice: Prompter can and will do mistakes in coding,
  # and we cannot nothing to do with it.
  #
  # Prompter requires token to work.
  # For ChatGPT    - https://platform.openai.com/api-keys
  # For Gemini     - https://aistudio.google.com/app/apikey
  # For OpenRouter - https://openrouter.ai/settings/keys
  # Note: Services give you free trial, but
  #       for general usage you can be forced
  #       to pay services for using prompter.
  #
  # For example: /env make when player right clicks on
  #                   magma block it gives random item
  prompt-handler:

    # Type of AI to use in prompter.
    #
    # none - Disable coding prompter.
    # gemini - Google Gemini.
    # chatgpt - OpenAI ChatGPT.
    # openrouter - OpenRouter.
    type: "none"

    # Specific model of LLM.
    #
    # For ChatGPT, use: "gpt-4o-mini"
    # For Gemini, use "gemini-2.5-flash"
    # For OpenRouter, use: "google/gemini-2.5-flash"
    model: "gemini-2.5-flash"

    #
    # Secret key here, don't share it with anyone!
    # If you have it here, then DON'T SHARE config.yml with anyone!
    #
    token: "insert-secret-api-key-here-but-do-not-share-it-with-others"

    # Maximum time amount for thinking in seconds.
    timeout: 120

    # Maximum amount of executors.
    executors-limit: 10

#
# We want to prevent players from hurting
# server with some bad items. These items
# will be edited or entirely removed from
# player's inventory.
#
item-fixer:

  # Enables item fixer.
  enabled: true

  # Maximum length of item's display name.
  display-name-max-length: 64

  # Maximum length of lore line in item.
  lore-line-max-length: 100

  # Maximum lines amount in item.
  lore-lines-max-amount: 25

  # Maximum enchantment level (swords, armor...)
  max-enchantment-level: 10

  # Limit of bad items (containers, books) inside container.
  container-big-items-max-amount: 3

  # Limit of book pages.
  books-pages-max-amount: 50

  # Removes some attribute modifiers from item (scale, speed, strength).
  remove-attribute-modifiers: true

  # Removes clickable components from books.
  remove-clickable-in-books: true

  # Removes custom data in spawn eggs.
  remove-custom-spawn-eggs: true

  # Removes ender dragon and wither spawn eggs.
  remove-boss-spawn-eggs: true

  # Maximum length of entity's name.
  entity-name-max-length: 48

  # Maximum size of persistent data container.
  persistent-data-max-size: 2048

  # Maximum amount of entities, that blocks (beehives) can hold.
  entities-max-amount: 3

  # Removes commands inside command block items.
  clear-command-blocks-data: true

#
# We want to prevent players from hurting
# server with some bad scenarios. These scenarios
# will lead to changing world's behavior.
#
world-fixer:

  #
  # If your server has disabled advancements (spigot.yml, disable-saving: true, disabled: ['*']),
  # players can't unlock recipes by default. This option allows to unlock all Minecraft crafting recipes.
  #
  # none - Don't unlock recipes.
  # crafting - When player opens crafting table.
  # join - When player joins the server.
  #
  give-all-recipes-on: none

  vehicle-collisions:
    # Destroys minecarts with too many collisions.
    enabled: true

    # Maximum amount of collisions in the last 0.5 seconds.
    max-collisions: 100

  bad-entities-in-air:
    # Destroys armor stands, vehicles and projectiles, when they're flying next to each other
    enabled: true

#
# These commands will be executed on
# some events. You can add functionality,
# like sending message with DiscordSRV.
#
commands:
  onLobby: # Event (%player%)
    first: # Command name
      command: "" # Command to execute, without slashes /
      delay: 0 # Delay (in ticks, 1 second = 20 ticks)
      console: true # true - Execute as console, false - as player
  onPlanetConnect: {} # %planet% %player%
  onPlanetDisconnect: {} # %planet% %player%
  onPlanetCreation: { } # %planet% %player% %generator% %environment% %structures% %seed%
  onWorldChat: {} # %world% %player% %message% %formatted%
  onCreativeChat: {} # %player% %message% %formatted%
  onMaintenanceStart: {} # %player%
  onMaintenanceEnd: {} # %player%

#
# If player's input new text will not follow
# these requirements, then world's setting
# will be not changed.
#
requirements:
  world-creation:
    played-seconds: 30
  world-reputation:
    creation-seconds: 300
  world-name:
    min-length: 4
    max-length: 30
  world-description:
    min-length: 4
    max-length: 256
  world-custom-id:
    pattern: "^[a-zA-Zа-яА-Я0-9_]+$"
    min-length: 2
    max-length: 16
  module-name:
    min-length: 4
    max-length: 30
  module-description:
    min-length: 4
    max-length: 256

#
# Groups are made for specifying players permissions,
# like world size, world limits, worlds amount.
#
groups:
  default: # default - by default for any player, no permissions required
    cooldowns: # In seconds
      generic-command: 5 # /play, /build, /games
      advertisement: 120 # /ad
      creative-chat: 10 # /cc
      world-chat: 2 # chat in the world
      module-usage: 7 # creating, pasting modules
      duplication-usage: 7 # duplicating blocks with manipulator
      world-download: 120 # downloading world with /world download
      prompter-usage: 60 # generating code with prompter /env make
    creating-world:
      limit: 2
    creating-module:
      limit: 2
    lobby-permissions: # Permissions will be given when player teleports to lobby
      - "music.play"
    world:
      size: 128
      like-reward: 1
      advertisement-cost: 0
      coding-prompter: false # Access to /env make command
      limits:
        #
        # Limits for a world, that player created.
        #
        executor-calls: 100 # limit of executor calls
        coding-actions-calls: 500 # limit of actions per 3 seconds.
        entities-amount: 50 # limit for spawned entities in world
        modifying-blocks: 5000 # limit for changing blocks with world actions per second
        redstone-changes: 100 # limit for redstone operations in world
        repeats-amount: 100 # limit for repeat action per 1 second.
        opening-inventories: 5 # limit for opening inventories per 5 seconds for preventing anti-exit
        sending-web-requests: 5 # limit for sending web requests per 5 seconds for preventing attacks
        variables-amount: 50 # limit for amount of all variables in world (saved, global, local)
        scoreboards-amount: 5 # limit for amount of all scoreboards
        bossbars-amount: 5 # limit for amount of all bossbars
        recipes-amount: 10 # limit for amount of all custom crafting and cooking recipes
        coding-platforms: 4 # limit for coding platforms
        changing-list-elements: 50 # limit of changing elements in lists and maps per second
        changing-targets: 200 # limit of changing targets (setting, adding, removing) with Selection Action
        builders-amount: 10 # limit of added builders
        developers-amount: 10 # limit of added developers
        blacklisted-amount: 10 # limit of banned players
        whitelisted-amount: 10 # limit of whitelisted players
        physical-objects: 140 # limit of special physical objects (it's not sand, gravels; they can be spawned with code)
        selected-lines-amount: 3 # limit of selected lines with manipulator
        errors-amount: 10 # limit for amount of serious errors per 3 seconds for preventing crashes
        script-size: 10 # maximum size of script file in megabytes
      per-player-limit-modifiers:
        #
        # When a player joins a world or leaves from world,
        # this will increase or decrease limits values.
        #
        executor-calls: 100
        coding-actions-calls: 10
        entities-amount: 50
        modifying-blocks: 0
        redstone-changes: 20
        variables-amount: 50
        scoreboards-amount: 1
        repeats-amount: 10
        changing-list-elements: 10
        changing-targets: 100
        bossbars-amount: 1
        physical-objects: 5
      build-permissions: # Permissions will be given when player types /build command
        - "headdb.open"
        - "worldedit.wand"
        - "minecraft.debugstick"
        #- "worldedit.region.set"
      play-permissions: # Permissions will be given when player types /play command
        - "headdb.open"
      dev-permissions: # Permissions will be given when player types /dev command
        - "headdb.open"
        - "essentials.itemname"
        # If you want to deny permission, that player has (maybe he's admin),
        # just add ! at the beginning of permission node.
        # - !nte.default
      visitor-permissions:     # Permissions will be given when player joins the build world (/play, /build),
        - "essentials.ptime" # but they're not builder/developer/world owner. If player becomes developer/builder
                             # visitor permissions will be removed from player.
  premium:
    permission: "opencreative.group.premium"
    inherits: "default"
    cooldowns:
      generic-command: 3
      advertisement: 100
      creative-chat: 4
      world-chat: 1
      module-usage: 7
      duplication-usage: 7
      world-download: 120
      prompter-usage: 60
    creating-world:
      limit: 4
    creating-module:
      limit: 4
    lobby-permissions:
      - "music.play"
    world:
      size: 256
      like-reward: 1
      advertisement-cost: 0
      coding-prompter: true
      limits:
        executor-calls: 120
        coding-actions-calls: 500
        entities-amount: 200
        modifying-blocks: 7500
        redstone-changes: 200
        opening-inventories: 5
        sending-web-requests: 5
        variables-amount: 500
        recipes-amount: 10
        scoreboards-amount: 10
        bossbars-amount: 10
        coding-platforms: 4
        repeats-amount: 100
        changing-list-elements: 50
        changing-targets: 200
        builders-amount: 10
        developers-amount: 10
        blacklisted-amount: 10
        whitelisted-amount: 10
        physical-objects: 140
        selected-lines-amount: 3
        errors-amount: 10
        script-size: 10
      per-player-limit-modifiers:
        executor-calls: 30
        coding-actions-calls: 10
        entities-amount: 50
        modifying-blocks: 0
        redstone-changes: 20
        repeats-amount: 10
        changing-list-elements: 10
        changing-targets: 100
        variables-amount: 50
        scoreboards-amount: 1
        bossbars-amount: 1
        physical-objects: 5
      build-permissions:
        - "headdb.open"
        - "worldedit.wand"
        - "minecraft.debugstick"
        #- "worldedit.region.set"
        #- "worldedit.region.replace"
      play-permissions:
        - "headdb.open"
      dev-permissions:
        - "headdb.open"
        - "essentials.itemname"
      visitor-permissions:
        - "essentials.ptime"

