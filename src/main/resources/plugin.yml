name: 'OpenCreative'
main: ua.mcchickenstudio.opencreative.OpenCreative
api-version: 1.21

version: '6.0.0 Preview'
description: 'Let players create the worlds'
build: ${build_timestamp}

authors: [McChicken Studio]
contributors: [McChicken Team, onn512, pawsashatoy, LWJENNI, HACKERPRO17, liventmst, logiklop, 70N77U]
prefix: "OC+"

load: POSTWORLD
database: false
website: https://gitlab.com/eagles-creative/opencreative

softdepend: [PacketEvents, PlaceholderAPI, ProtocolLib, Vault, LibsDisguises]

